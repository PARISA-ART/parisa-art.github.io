<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PARISA ART — A House of Creation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

/* MAIN ENTRANCE */

.entrance {
    position: relative;
    width: 100%;
    height: 100vh;

    background-image: url("emarat.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    overflow: hidden;
}

/* CINEMATIC DARK LAYER */

.entrance::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,0.20),
            rgba(0,0,0,0.08) 45%,
            rgba(0,0,0,0.48)
        );
}

/* LOGO */

.logo {
    position: absolute;
    top: 38px;
    left: 50%;
    transform: translateX(-50%);

    color: white;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px;
    font-weight: 400;

    letter-spacing: 9px;

    white-space: nowrap;

    z-index: 2;
}

/* CENTER CONTENT */

.center {
    position: absolute;

    left: 50%;
    bottom: 9%;

    transform: translateX(-50%);

    width: 90%;

    text-align: center;
    color: white;

    z-index: 2;
}

.welcome {
    font-size: 10px;
    letter-spacing: 6px;
    text-transform: uppercase;

    margin-bottom: 18px;

    opacity: 0.85;
}

.title {
    font-family: Georgia, "Times New Roman", serif;

    font-size: clamp(38px, 6vw, 85px);
    font-weight: 400;

    letter-spacing: 9px;

    line-height: 1;
}

.subtitle {
    margin-top: 17px;

    font-size: 11px;
    letter-spacing: 7px;

    text-transform: uppercase;

    opacity: 0.9;
}

/* ENTER BUTTON */

.enter {
    display: inline-block;

    margin-top: 35px;

    padding: 14px 34px;

    border: 1px solid rgba(255,255,255,0.65);

    color: white;
    text-decoration: none;

    font-size: 10px;
    letter-spacing: 5px;

    text-transform: uppercase;

    transition: 0.4s ease;

    backdrop-filter: blur(4px);
}

.enter:hover {
    background: white;
    color: black;
}

/* SCROLL TEXT */

.scroll {
    position: absolute;

    right: 28px;
    bottom: 34px;

    color: rgba(255,255,255,0.75);

    font-size: 8px;
    letter-spacing: 4px;

    writing-mode: vertical-rl;

    z-index: 2;
}

/* MOBILE */

@media (max-width: 700px) {

    .logo {
        top: 28px;
        font-size: 15px;
        letter-spacing: 6px;
    }

    .center {
        bottom: 12%;
    }

    .title {
        letter-spacing: 5px;
    }

    .subtitle {
        letter-spacing: 4px;
        font-size: 9px;
    }

    .scroll {
        display: none;
    }
}
</style>
</head>


<body>

<section class="entrance">

    <div class="logo">
        PARISA ART
    </div>

    <div class="center">

        <div class="welcome">
            Welcome to
        </div>

        <h1 class="title">
            THE CREATION MANSION
        </h1>

        <div class="subtitle">
            Create · Inspire · Transform
        </div>

        <a href="#explore" class="enter">
            Enter
        </a>

    </div>

    <div class="scroll">
        SCROLL TO EXPLORE
    </div>

</section>


<section id="explore"
style="
height:100vh;
background:#f4f3ef;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
">

<div>

<p style="
font-size:10px;
letter-spacing:6px;
margin-bottom:25px;
">
A HOUSE OF CREATION
</p>

<h2 style="
font-family:Georgia,serif;
font-weight:400;
font-size:clamp(42px,7vw,90px);
letter-spacing:5px;
">
WHERE IDEAS<br>
BECOME ART
</h2>

</div>

</section>

</body>
</html>
